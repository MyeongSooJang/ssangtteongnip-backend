server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ssangtteongnip}
    username: ${PGUSER:${DB_USERNAME:postgres}}
    password: ${PGPASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    # 기본값(true)을 그대로 명시한다. false로 바꾸면 컨트롤러·DTO 변환 단계의 지연 로딩이 LazyInitializationException이 된다.
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # 목록에서 글마다 이미지 개수를 셀 때 이미지를 글 20개씩 묶어서 가져온다(글당 쿼리 1번이 되지 않도록).
        default_batch_fetch_size: 20
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 5MB
      # 게시글 이미지 5장(장당 5MB)과 제목·내용 필드를 한 요청에 받는다.
      max-request-size: 26MB

app:
  mail:
    from: ${MAIL_FROM}
    gmail:
      client-id: ${GMAIL_CLIENT_ID}
      client-secret: ${GMAIL_CLIENT_SECRET}
      refresh-token: ${GMAIL_REFRESH_TOKEN}
  # 회사 이름 자동완성용 기업 목록(OpenDART). 키가 없으면 목록을 받지 않을 뿐 기동은 정상이다.
  dart:
    api-key: ${DART_API_KEY:}
  storage:
    bucket: ${S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    presign-ttl: ${S3_PRESIGN_TTL:5m}

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
